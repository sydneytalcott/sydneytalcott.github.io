<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{title}} — {{siteTitle}}</title>
  {{component:head}}
  {{style:main.css}}
  <!-- Three.js for 3D Mesh Rendering -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  {{script:site.js}}
  {{script:mesh.js}}
</head>
<body>
  <div class="app-container">
    {{component:header}}

    <header class="work-header reveal">
      <div class="work-header-top">
        <h1 class="page-title">{{title}}</h1>
        <span class="page-category-tag">{{categoryTag}}</span>
      </div>
      <p class="work-header-subtitle">{{intro}}</p>
    </header>

    <main>
      <article class="project-card reveal" id="interactive-3d-mesh">
        <div class="project-canvas-wrapper" id="canvasContainer">
          <canvas id="meshCanvas" class="three-canvas"></canvas>
        </div>

        <div class="project-content">
          <div class="project-meta-row">
            <div>
              <h2 class="project-headline">{{projectTitle}}</h2>
            </div>
            <div class="project-tags">
              <span class="tag-badge">{{tag1}}</span>
              <span class="tag-badge">{{tag2}}</span>
              <span class="tag-badge">{{tag3}}</span>
            </div>
          </div>

          <div class="work-footer-nav">
            <a href="{{siteUrl || '/'}}" class="back-home-link">
              <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
              <span>{{backLabel}}</span>
            </a>
            <a href="mailto:{{contactEmail}}" class="btn">{{contactCta}}</a>
          </div>
        </div>
      </article>
    </main>

    {{component:footer}}
  </div>
</body>
</html>
